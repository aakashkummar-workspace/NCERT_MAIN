# Local Postgres on 5434. Not 5432 (usually another project) and not 5433,
# which on this machine belongs to setu-postgres — 5432 usually belongs to another project on
# a developer's machine, and diagnosing "connected to the wrong database" costs
# a morning. See DEPLOYMENT.md section 1.
services:
  db:
    image: postgres:16-alpine
    container_name: sahayak-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sahayak
    ports:
      - "5434:5432"
    volumes:
      - sahayak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sahayak"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sahayak-pgdata:
